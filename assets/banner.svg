<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="AI Water Infrastructure Leak and Contamination Digital Twin banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="52%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="18%" r="72%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .title{font:800 39px Arial,Helvetica,sans-serif;fill:#f8fafc;letter-spacing:-.45px}
      .sub{font:700 20px Arial,Helvetica,sans-serif;fill:#a7f3d0}
      .body{font:500 15px Arial,Helvetica,sans-serif;fill:#dbeafe}
      .chip{font:700 13px Arial,Helvetica,sans-serif;fill:#ecfeff}
      .tiny{font:500 12px Arial,Helvetica,sans-serif;fill:#94a3b8}
      .cardLabel{font:700 14px Arial,Helvetica,sans-serif;fill:#e0f2fe}
    </style>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>

  <g opacity="0.12" stroke="#dbeafe" stroke-width="1.1" fill="none">
    <path d="M72 102 C210 46 332 154 486 92 C660 22 816 110 978 146 C1066 166 1128 142 1162 112"/>
    <path d="M70 266 C208 214 342 302 488 252 C668 192 810 248 956 286 C1042 308 1114 282 1164 238"/>
    <path d="M122 72 L290 134 L462 84 L656 176 L850 92 L1068 164"/>
  </g>

  <g transform="translate(72 68)">
    <text class="title" x="0" y="48">AI Water Infrastructure Digital Twin</text>
    <text class="sub" x="0" y="88">Leak Detection • Contamination Signals • Utility Risk Review</text>
    <text class="body" x="0" y="125">Synthetic water-network lab for pressure, flow, quality telemetry,</text>
    <text class="body" x="0" y="148">sensor faults, robustness tests, and response-priority ranking.</text>

    <g transform="translate(0 188)">
      <rect x="0" y="0" width="118" height="32" rx="16" fill="#0369a1" opacity="0.95"/>
      <text class="chip" x="59" y="21" text-anchor="middle">Leak Risk</text>
      <rect x="136" y="0" width="158" height="32" rx="16" fill="#0f766e" opacity="0.95"/>
      <text class="chip" x="215" y="21" text-anchor="middle">Contamination Signals</text>
      <rect x="312" y="0" width="128" height="32" rx="16" fill="#1d4ed8" opacity="0.95"/>
      <text class="chip" x="376" y="21" text-anchor="middle">Sensor Faults</text>
      <rect x="458" y="0" width="126" height="32" rx="16" fill="#7c3aed" opacity="0.95"/>
      <text class="chip" x="521" y="21" text-anchor="middle">Audit Trail</text>
    </g>

    <text class="tiny" x="0" y="256">Synthetic planning-support scaffold only — not SCADA control, public-health advice, or drinking-water safety certification.</text>
  </g>

  <g transform="translate(872 74)" filter="url(#shadow)">
    <rect x="0" y="0" width="252" height="206" rx="26" fill="#020617" opacity="0.74" stroke="#334155"/>
    <g transform="translate(42 42)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 42 H88 V20 H166" stroke="#67e8f9" stroke-width="10"/>
      <path d="M88 42 V112 H148" stroke="#34d399" stroke-width="10"/>
      <path d="M20 112 H88" stroke="#38bdf8" stroke-width="10"/>
      <circle cx="20" cy="42" r="11" fill="#22d3ee" stroke="none"/>
      <circle cx="166" cy="20" r="11" fill="#a7f3d0" stroke="none"/>
      <circle cx="148" cy="112" r="11" fill="#38bdf8" stroke="none"/>
      <circle cx="20" cy="112" r="11" fill="#f59e0b" stroke="none"/>
    </g>
    <path d="M126 62 C106 88 96 108 96 126 C96 148 110 164 126 164 C142 164 156 148 156 126 C156 108 146 88 126 62 Z" fill="#0ea5e9" opacity="0.35"/>
    <text class="cardLabel" x="126" y="190" text-anchor="middle">Network Intelligence</text>
  </g>
</svg>